name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare codexi asset
        shell: bash
        run: |
          set -euo pipefail
          chmod +x codexi
          sed -i "s/^CODEXI_VERSION=\"dev\"$/CODEXI_VERSION=\"${GITHUB_REF_NAME}\"/" codexi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: codexi
          generate_release_notes: true
